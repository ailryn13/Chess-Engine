<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Analyzer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- jQuery (Required by Chessboard.js) -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  
  <!-- Chessboard.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  
  <!-- Chess.js (Game Rules & Logic) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

  <h1 class="text-3xl font-extrabold mb-6 tracking-wide text-indigo-400">Stockfish Chess Dashboard</h1>

  <div class="flex items-center gap-6 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
    <!-- Visual Eval Bar -->
    <div id="evalBarContainer" class="relative w-8 h-[400px] bg-slate-950 rounded-lg overflow-hidden flex flex-col justify-end border border-slate-700">
      <div id="evalBarWhite" class="w-full bg-slate-100 transition-all duration-500 ease-out" style="height: 50%;"></div>
      <span id="evalScore" class="absolute bottom-2 left-0 right-0 text-[11px] font-bold text-slate-900 text-center select-none">0.0</span>
    </div>

    <!-- Chessboard -->
    <div>
      <div id="board" style="width: 400px;"></div>
      <div class="mt-4 flex gap-3">
        <button id="startBtn" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm transition">
          Reset Board
        </button>
      </div>
    </div>
  </div>

  <script>
   const game = new Chess();

const board = Chessboard('board', {
  draggable: true,
  position: 'start',
  // Tell chessboard.js to pull the piece images directly from the CDN
  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
  onDrop: function(source, target) {
    const move = game.move({
      from: source,
      to: target,
      promotion: 'q'
    });

    if (move === null) return 'snapback';

    console.log("Current Position (FEN):", game.fen());
  }
});

    document.getElementById('startBtn').addEventListener('click', () => {
      game.reset();
      board.start();
    });
  </script>
</body>
</html>
